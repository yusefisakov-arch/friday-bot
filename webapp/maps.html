<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Карты задач</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
  h2 { margin: 0 0 4px; font-size: 18px; }
  .legend { font-size: 11px; color: var(--tg-theme-hint-color, #888); margin-bottom: 12px; }

  #grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tile { border-radius: 12px; padding: 11px; min-height: 92px; cursor: pointer; color: #fff;
          display: flex; flex-direction: column; justify-content: space-between; }
  .tile .ttl { font-weight: 700; font-size: 13px; line-height: 1.2; }
  .tile .sub { font-size: 11px; opacity: 0.95; margin-top: 4px; }
  .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.35); margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #fff; }
  .p0 { background: #78909C; }
  .p1 { background: #E53935; }
  .p2 { background: #FB8C00; }
  .p3 { background: #43A047; }

  .ovl { position: fixed; inset: 0; background: var(--tg-theme-bg-color, #fff); overflow-y: auto;
         padding: 16px; display: none; }
  .ovl.show { display: block; }
  .back { color: var(--tg-theme-link-color, #2481cc); font-size: 15px; margin-bottom: 12px; display: inline-block; cursor: pointer; }
  .status-line { font-size: 13px; margin-bottom: 12px; padding: 9px 11px; border-radius: 9px;
                 background: var(--tg-theme-secondary-bg-color, #f0f0f0); }
  .now { border-left: 4px solid #43A047; padding: 9px 11px; border-radius: 9px; margin-bottom: 14px;
         background: var(--tg-theme-secondary-bg-color, #f0f0f0); font-size: 14px; }
  .now b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
           color: var(--tg-theme-hint-color, #888); margin-bottom: 5px; }
  .now div { margin: 3px 0; }

  .node { margin: 2px 0; }
  .row { display: flex; align-items: flex-start; gap: 7px; padding: 7px 8px; border-radius: 8px; cursor: pointer;
         background: var(--tg-theme-secondary-bg-color, #f4f4f4); }
  .row:active { opacity: .7; }
  .row .mark { flex: 0 0 auto; font-size: 14px; line-height: 1.35; }
  .row .txt { flex: 1; font-size: 14px; line-height: 1.35; }
  .row .pct { flex: 0 0 auto; font-size: 11px; font-weight: 700; color: var(--tg-theme-hint-color, #888); }
  .row.branch { background: transparent; font-weight: 600; }
  .row.atom.done .txt { text-decoration: line-through; opacity: .55; }
  .kids { margin-left: 14px; padding-left: 8px; border-left: 2px solid var(--tg-theme-hint-color, #ddd); }
  .kids.hide { display: none; }
  .empty { color: var(--tg-theme-hint-color, #888); font-size: 14px; padding: 20px 0; }
</style>
</head>
<body>
  <h2>🧠 Карты задач</h2>
  <div class="legend">Тапни карту — раскроется дерево. Тап по ветке сворачивает её, тап по атому отмечает выполнение.</div>
  <div id="grid">Загрузка…</div>

  <div id="ovl" class="ovl">
    <span class="back" id="back">‹ Назад к картам</span>
    <h2 id="ov-title"></h2>
    <div class="status-line" id="ov-status"></div>
    <div class="now" id="ov-now"></div>
    <div id="tree"></div>
    <div style="height:40px"></div>
  </div>

<script>
  var tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  var WAKEY = new URLSearchParams(location.search).get("k") || "";
  var currentId = null, collapsed = {};

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "X-Webapp-Key": WAKEY }, opts.headers || {});
    return fetch(path, opts);
  }
  function esc(s) { var p = document.createElement("span"); p.textContent = s || ""; return p.innerHTML; }
  function cls(pct, atoms) {
    if (!atoms) return "p0";
    if (pct >= 100) return "p3";
    if (pct >= 34) return "p2";
    return "p1";
  }

  function loadGrid() {
    api("/api/decompositions").then(function (r) { return r.json(); }).then(function (items) {
      var g = document.getElementById("grid");
      g.innerHTML = "";
      if (!items.length) { g.innerHTML = '<div class="empty">Карт пока нет.<br>Напиши боту: «разложи &lt;задача&gt;» — он построит дерево.</div>'; return; }
      items.forEach(function (m) {
        var pct = m.atoms ? Math.round(m.done * 100 / m.atoms) : 0;
        var d = document.createElement("div");
        d.className = "tile " + cls(pct, m.atoms);
        d.innerHTML = '<div class="ttl">' + esc(m.title) + '</div>' +
          '<div><div class="sub">' + (m.atoms ? (m.done + " из " + m.atoms + " · " + pct + "%") : "без атомов") + '</div>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
        d.onclick = function () { openMap(m.id); };
        g.appendChild(d);
      });
    }).catch(function () { document.getElementById("grid").textContent = "Ошибка загрузки."; });
  }

  // прогресс ветки = доля закрытых атомов среди её потомков
  function stats(node, byParent) {
    if (node.is_atom) return { total: 1, done: node.done ? 1 : 0 };
    var t = 0, d = 0;
    (byParent[node.id] || []).forEach(function (k) {
      var s = stats(k, byParent);
      t += s.total; d += s.done;
    });
    return { total: t, done: d };
  }

  function renderNodes(list, byParent, box) {
    list.forEach(function (n) {
      var kids = byParent[n.id] || [];
      var wrap = document.createElement("div");
      wrap.className = "node";
      var row = document.createElement("div");
      var s = stats(n, byParent);
      if (n.is_atom) {
        row.className = "row atom" + (n.done ? " done" : "");
        row.innerHTML = '<span class="mark">' + (n.done ? "✅" : "⬜") + '</span><span class="txt">' + esc(n.title) + '</span>';
        row.onclick = function (e) {
          e.stopPropagation();
          toggleAtom(n, row);
        };
      } else {
        var isHid = collapsed[n.id];
        row.className = "row branch";
        var pct = s.total ? Math.round(s.done * 100 / s.total) : 0;
        row.innerHTML = '<span class="mark">' + (isHid ? "▸" : "▾") + '</span><span class="txt">' + esc(n.title) + '</span>' +
                        (s.total ? '<span class="pct">' + pct + '%</span>' : '');
        row.onclick = function (e) {
          e.stopPropagation();
          collapsed[n.id] = !collapsed[n.id];
          openMap(currentId, true);
        };
      }
      wrap.appendChild(row);
      if (kids.length) {
        var kb = document.createElement("div");
        kb.className = "kids" + (collapsed[n.id] ? " hide" : "");
        renderNodes(kids, byParent, kb);
        wrap.appendChild(kb);
      }
      box.appendChild(wrap);
    });
  }

  function toggleAtom(n, row) {
    var want = !n.done;
    api("/api/decomposition/toggle", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ node_id: n.id, done: want })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res.ok) { tg.showAlert("У этого пункта нет задачи, сэр."); return; }
      try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {}
      openMap(currentId, true);
    }).catch(function () { tg.showAlert("Ошибка."); });
  }

  function openMap(id, keepScroll) {
    currentId = id;
    var y = window.scrollY;
    api("/api/decomposition?id=" + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (m) {
      document.getElementById("ov-title").textContent = m.title;
      var byParent = {}, roots = [];
      m.nodes.forEach(function (n) {
        if (n.parent_id) { (byParent[n.parent_id] = byParent[n.parent_id] || []).push(n); }
        else roots.push(n);
      });
      var atoms = m.nodes.filter(function (n) { return n.is_atom; });
      var done = atoms.filter(function (n) { return n.done; });
      var pct = atoms.length ? Math.round(done.length * 100 / atoms.length) : 0;
      document.getElementById("ov-status").textContent =
        atoms.length ? ("Выполнено " + done.length + " из " + atoms.length + " атомов · " + pct + "%")
                     : "В этой карте нет атомов.";

      var next = atoms.filter(function (n) { return !n.done; }).slice(0, 3);
      var nowBox = document.getElementById("ov-now");
      if (next.length) {
        nowBox.innerHTML = "<b>Делать сейчас</b>" + next.map(function (n, i) {
          return "<div>" + (i === 0 ? "👉 " : "· ") + esc(n.title) + "</div>";
        }).join("");
        nowBox.style.display = "block";
      } else if (atoms.length) {
        nowBox.innerHTML = "<b>Готово</b><div>🎉 Все атомы закрыты, сэр.</div>";
        nowBox.style.display = "block";
      } else { nowBox.style.display = "none"; }

      var tree = document.getElementById("tree");
      tree.innerHTML = "";
      renderNodes(roots, byParent, tree);

      document.getElementById("ovl").classList.add("show");
      if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
      loadGrid();
    }).catch(function () { tg.showAlert("Не удалось открыть карту."); });
  }

  document.getElementById("back").onclick = function () {
    document.getElementById("ovl").classList.remove("show");
    currentId = null;
    window.scrollTo(0, 0);
  };

  loadGrid();
</script>
</body>
</html>
