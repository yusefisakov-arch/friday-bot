<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Почта</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
  h2 { margin: 0 0 4px; font-size: 18px; }
  .legend { font-size: 11px; color: var(--tg-theme-hint-color, #888); margin-bottom: 14px; line-height: 1.45; }
  .legend a { color: var(--tg-theme-link-color, #2481cc); }

  .acc { background: var(--tg-theme-secondary-bg-color, #f4f4f4); border-radius: 11px;
         padding: 11px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .acc .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; background: #43A047; }
  .acc .dot.off { background: #B0BEC5; }
  .acc .info { flex: 1; min-width: 0; }
  .acc .em { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc .sub { font-size: 11px; color: var(--tg-theme-hint-color, #888); margin-top: 2px; }
  .acc .del { color: #E53935; font-size: 19px; padding: 4px 6px; cursor: pointer; flex: 0 0 auto; }

  form { margin-top: 18px; }
  label { display: block; font-size: 12px; color: var(--tg-theme-hint-color, #888); margin: 12px 0 5px; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; padding: 11px 12px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--tg-theme-hint-color, #ddd);
    background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
  .check { display: flex; align-items: center; gap: 9px; margin: 14px 0; font-size: 14px; }
  .check input { width: 19px; height: 19px; }
  .check .hint { font-size: 11px; color: var(--tg-theme-hint-color, #888); margin-top: 2px; }

  button { width: 100%; padding: 13px; font-size: 15px; font-weight: 600; border: none;
           border-radius: 10px; margin-top: 12px; cursor: pointer;
           background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  button.ghost { background: transparent; color: var(--tg-theme-link-color, #2481cc); }
  button:disabled { opacity: .5; }

  #msg { margin-top: 12px; padding: 11px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45; display: none; }
  #msg.show { display: block; }
  #msg.ok { background: #E8F5E9; color: #1B5E20; }
  #msg.err { background: #FFEBEE; color: #B71C1C; }
  .empty { color: var(--tg-theme-hint-color, #888); font-size: 14px; padding: 6px 0 2px; }
</style>
</head>
<body>
  <h2>📬 Почта</h2>
  <div class="legend">
    Вводи <b>пароль приложения</b>, а не обычный пароль от почты.
    Для Gmail он создаётся тут: <a href="https://myaccount.google.com/apppasswords" target="_blank">myaccount.google.com/apppasswords</a> —
    16 символов. Пароль хранится в зашифрованном виде, письма бот только читает.
  </div>

  <div id="list" class="empty">Загрузка…</div>

  <form id="f" onsubmit="return false;">
    <label>Адрес почты</label>
    <input type="email" id="email" placeholder="name@gmail.com" autocomplete="off">

    <label>Пароль приложения (16 символов)</label>
    <input type="password" id="password" placeholder="xxxx xxxx xxxx xxxx" autocomplete="off">

    <label>Название (необязательно)</label>
    <input type="text" id="label" placeholder="Личная / Рабочая" autocomplete="off">

    <div class="check">
      <input type="checkbox" id="noisy">
      <div>
        Шумный ящик
        <div class="hint">Только важное: рассылки и уведомления бот пропустит.</div>
      </div>
    </div>

    <button id="save">Проверить и подключить</button>
    <button id="test" class="ghost">Только проверить пароль</button>
  </form>

  <div id="msg"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const $ = id => document.getElementById(id);
const msg = (text, ok) => { const m = $('msg'); m.textContent = text; m.className = 'show ' + (ok ? 'ok' : 'err'); };

function body() {
  return {
    email: $('email').value.trim(),
    password: $('password').value.replace(/\s+/g, ''),
    label: $('label').value.trim(),
    noisy: $('noisy').checked
  };
}

async function load() {
  try {
    const r = await fetch('/api/mail/list');
    const rows = await r.json();
    const el = $('list');
    if (!rows.length) { el.className = 'empty'; el.textContent = 'Пока ни одного ящика.'; return; }
    el.className = '';
    el.innerHTML = rows.map(a => `
      <div class="acc">
        <div class="dot ${a.active ? '' : 'off'}"></div>
        <div class="info">
          <div class="em">${a.email}</div>
          <div class="sub">${a.label || ''}${a.noisy ? ' · только важное' : ''}</div>
        </div>
        <div class="del" data-id="${a.id}">✕</div>
      </div>`).join('');
    el.querySelectorAll('.del').forEach(d => d.onclick = () => remove(d.dataset.id));
  } catch (e) { msg('Не загрузить список: ' + e, false); }
}

async function remove(id) {
  if (!confirm('Отключить этот ящик?')) return;
  await fetch('/api/mail/delete', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ id })
  });
  load();
}

async function send(url, okThen) {
  const b = body();
  if (!b.email) { msg('Впиши адрес почты.', false); return; }
  $('save').disabled = $('test').disabled = true;
  msg('Подключаюсь к почте…', true);
  try {
    const r = await fetch(url, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(b)
    });
    const res = await r.json();
    msg(res.message || (res.ok ? 'Готово ✓' : 'Не вышло'), res.ok);
    if (res.ok && okThen) { $('password').value = ''; load(); tg?.HapticFeedback?.notificationOccurred('success'); }
  } catch (e) { msg('Ошибка сети: ' + e, false); }
  $('save').disabled = $('test').disabled = false;
}

$('save').onclick = () => send('/api/mail/save', true);
$('test').onclick = () => send('/api/mail/test', false);
load();
</script>
</body>
</html>
